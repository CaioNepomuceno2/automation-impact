[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autoimpact"
version = "0.1.0"
description = "Quanto DEC um religador e o telecomando realmente evitam: diferenças em diferenças com dados abertos da ANEEL"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pyfixest>=0.30",
  "duckdb>=1.1",
  "pandas>=2.2",
  "pyarrow>=16",
  "pyogrio>=0.9",
  "geopandas>=1.0",  # pyogrio.read_dataframe exige geopandas (usado em bdgd.py)
  "requests>=2.32",
  "pyyaml>=6",
  "scipy>=1.13",
  "matplotlib>=3.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 115
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
